services:

  mysql:
    image: mysql:8

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ordersdb

    ports:
      - "3306:3306"

  service-a:
    build:
      context: ../src/ServiceA.Api

    ports:
      - "8080:8080"

  service-b:
    build:
      context: ../src/ServiceB.Api

    ports:
      - "8081:8081"

  otel-collector:
    image: otel/opentelemetry-collector-contrib

    volumes:
      - ../collector/otel-collector-config.yaml:/etc/otelcol/config.yaml