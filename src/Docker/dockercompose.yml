services:

  mysql:

    image: mysql:8

    environment:

      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: ordersdb

    ports:
      - "3306:3306"

  otel-collector:

    image: otel/opentelemetry-collector-contrib

    command:
      - "--config=/etc/otelcol/config.yaml"

    volumes:
      - ../collector/otel-collector-config.yaml:/etc/otelcol/config.yaml

    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  service-b:

    build:
      context: ../src/ServiceB.Api

    ports:
      - "8081:8080"

    depends_on:
      - mysql
      - otel-collector

  service-a:

    build:
      context: ../src/ServiceA.Api

    ports:
      - "8080:8080"

    depends_on:
      - service-b
      - otel-collector

      jaeger:

  image: jaegertracing/all-in-one:latest

  ports:
    - "16686:16686"
    - "14250:14250"

prometheus:

  image: prom/prometheus

  ports:
    - "9090:9090"

  volumes:

    - ../grafana/prometheus.yml:/etc/prometheus/prometheus.yml